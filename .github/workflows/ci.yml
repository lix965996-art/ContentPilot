name: Project checks

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: |
          python -m venv backend/.venv
          & backend/.venv/Scripts/python.exe -m pip install -r backend/requirements.lock.txt
          if ($LASTEXITCODE -ne 0) { throw 'Backend install failed' }
      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Frontend install failed' }
      - name: Run lint, build and isolated tests
        run: ./contentpilot.ps1 test
      - name: Retain browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: var/reports/playwright/
          retention-days: 7
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-compose-action@v2
      - name: Validate Compose configuration
        env:
          MYSQL_PASSWORD: ci-placeholder-password
          MYSQL_ROOT_PASSWORD: ci-placeholder-root-password
          JWT_SECRET: ci-secret-that-is-long-enough-for-validation
          PLATFORM_CREDENTIAL_KEY: ci-placeholder-key
        run: docker compose config --quiet
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install audit tools
        run: |
          pip install -r backend/requirements.lock.txt
          pip install "semgrep==1.181.0"
      - name: Python dependency audit
        run: pip-audit
      - name: Frontend production dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --registry=https://registry.npmjs.org
      - name: Semgrep backend
        run: semgrep scan --config p/python --metrics off --error backend/app
      - name: Semgrep frontend
        run: semgrep scan --config p/typescript --metrics off --error frontend/src
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MYSQL_PASSWORD: ci-placeholder-password
      MYSQL_ROOT_PASSWORD: ci-placeholder-root-password
      JWT_SECRET: ci-secret-that-is-long-enough-for-validation
      PLATFORM_CREDENTIAL_KEY: ci-placeholder-key
      APP_DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Start the stack and wait for health checks
        run: docker compose up -d --wait
      - name: Probe API and web health endpoints
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/api/health
          curl --fail --silent --show-error http://127.0.0.1:8080/healthz
      - name: Show container state
        run: docker compose ps
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v
  sqlite-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.lock.txt
      - name: Migrate and verify SQLite with foreign keys on
        working-directory: backend
        env:
          DATABASE_URL: sqlite:////tmp/contentpilot-ci.db
          SQLITE_FALLBACK_URL: sqlite:////tmp/contentpilot-ci.db
          APP_ENV: test
          APP_DEMO_MODE: "true"
          JWT_SECRET: ci-secret-that-is-long-enough-for-validation
          PLATFORM_CREDENTIAL_KEY: ci-placeholder-key
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m app.db.seed
          python ../scripts/check_sqlite_foreign_keys.py "$DATABASE_URL"
  mysql-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.lock.txt
      - name: Create disposable database
        run: |
          python - <<'PY'
          import pymysql

          connection = pymysql.connect(
              host="127.0.0.1", user="root", password="ci-root-password"
          )
          with connection.cursor() as cursor:
              cursor.execute(
                  "CREATE DATABASE contentpilot_ci "
                  "CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
              )
          connection.commit()
          connection.close()
          PY
      - name: Apply migrations and verify schema
        working-directory: backend
        env:
          DATABASE_URL: mysql+pymysql://root:ci-root-password@127.0.0.1:3306/contentpilot_ci?charset=utf8mb4
          APP_ENV: test
          APP_DEMO_MODE: "true"
          JWT_SECRET: ci-secret-that-is-long-enough-for-validation
          PLATFORM_CREDENTIAL_KEY: ci-placeholder-key
        run: |
          python -m alembic upgrade head
          python -m alembic current
          python -m alembic check
          python -m app.db.seed
          python ../scripts/check_mysql_migrations.py "$DATABASE_URL"
      - name: Run MySQL business integration tests
        working-directory: backend
        env:
          CONTENTPILOT_TEST_MYSQL_URL: mysql+pymysql://root:ci-root-password@127.0.0.1:3306/contentpilot_ci?charset=utf8mb4
          APP_ENV: test
          APP_DEMO_MODE: "true"
          JWT_SECRET: ci-secret-that-is-long-enough-for-validation
          PLATFORM_CREDENTIAL_KEY: ci-placeholder-key
        run: python -m pytest -q -m mysql_integration
